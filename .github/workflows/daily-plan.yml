name: QDII
on:
  schedule:
    - cron: '0 1 * * 1-5'   # UTC 1:00 = 北京 9:00 — 生成推荐+早报+发邮件
    - cron: '0 9 * * 1-5'   # UTC 9:00 = 北京 17:00 — 更新净值+外部信号+重建页面
  workflow_dispatch:
    inputs:
      dry_run:
        description: dry-run
        required: false
        default: false
        type: boolean
      # [fix] removed unused 'budget' input
      strategy:
        description: strategy
        required: false
        default: dynamic
        type: choice
        options:
          - dynamic
          - scarce
          - low_fee
          - equal

jobs:
  generate-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # [fix] add dependency caching
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Update NAV cache
        continue-on-error: true
        run: node scripts/update-nav-cache.js
      - name: Update purchase limits
        continue-on-error: true
        run: node scripts/update-purchase-limits.js
      - name: Update external signals
        continue-on-error: true
        run: node scripts/update-external-signals.js
      - name: Generate AI Daily Brief
        continue-on-error: true
        run: |
          node -e "
            var db = require('./lib/daily-brief');
            db.generateDailyBrief({
              apiKey: process.env.LLM_API_KEY,
              baseUrl: process.env.LLM_BASE_URL,
              model: process.env.LLM_MODEL
            }).then(function() {
              console.log('Daily brief generated');
            }).catch(function(e) {
              console.warn('Daily brief failed:', e.message);
            });
          "
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
      # [fix] replaced eval injection with safe direct command
      - name: Run allocation strategy & send email
        run: |
          STRATEGY="${{ inputs.strategy }}"
          if [ -z "$STRATEGY" ]; then STRATEGY="dynamic"; fi

          ARGS="--strategy $STRATEGY"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          echo "Running: node index.js $ARGS"
          node index.js $ARGS
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: Build GitHub Pages
        run: node build-pages.js
      - name: Commit updated data and pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/nav-cache.json data/fund-info-cache.json data/portfolio.json data/external-signals-cache.json data/daily-brief.json data/hypotheses.json
          # [fix] removed git add -f for docs/index.html (gitignored, built by pages.yml)
          git add -f docs/data/nav-cache.json docs/data/news.json docs/data/external-signals-cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update data & pages $(date +%Y/%m/%d)"
            # [fix] safer rebase: abort on conflict instead of silently ignoring
            git pull --rebase origin main || { git rebase --abort; echo "Rebase conflict, skipping push"; exit 0; }
            git push origin main || echo "Push failed, skipping"
          fi
