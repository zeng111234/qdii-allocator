name: QDII
on:
  schedule:
    - cron: '0 1 * * 1-5'   # UTC 1:00 = 北京 9:00 — 生成推荐+早报+发邮件
    - cron: '0 9 * * 1-5'   # UTC 9:00 = 北京 17:00 — 更新净值+外部信号+重建页面
  workflow_dispatch:
    inputs:
      dry_run:
        description: dry-run
        required: false
        default: false
        type: boolean
      # [fix] removed unused 'budget' input
      strategy:
        description: strategy
        required: false
        default: dynamic
        type: choice
        options:
          - dynamic
          - scarce
          - low_fee
          - equal

jobs:
  generate-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # [fix] add dependency caching
      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Configure private ledger temp path
        run: echo "PRIVATE_LEDGER_PATH=$RUNNER_TEMP/portfolio-ledger.json" >> "$GITHUB_ENV"
      - name: Fetch and validate private PortfolioLedgerV2
        run: |
          set +e
          node scripts/fetch-private-ledger.js
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "PRIVATE_LEDGER_AVAILABLE=1" >> "$GITHUB_ENV"
          else
            echo "PRIVATE_LEDGER_AVAILABLE=0" >> "$GITHUB_ENV"
            echo "::warning::Private PortfolioLedgerV2 unavailable; public market data and Pages will still update, personalized email/action is skipped."
          fi
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
          FIREBASE_UID: ${{ secrets.FIREBASE_UID }}
          PRIVATE_LEDGER_PATH: ${{ runner.temp }}/portfolio-ledger.json
      - name: Update NAV cache
        continue-on-error: true
        run: node scripts/update-nav-cache.js
      - name: Update purchase limits
        continue-on-error: true
        run: node scripts/update-purchase-limits.js
      - name: Update external signals
        continue-on-error: true
        run: node scripts/update-external-signals.js
      - name: Generate AI Daily Brief
        continue-on-error: true
        run: |
          node -e "
            var db = require('./lib/daily-brief');
            db.generateDailyBrief({
              apiKey: process.env.LLM_API_KEY,
              baseUrl: process.env.LLM_BASE_URL,
              model: process.env.LLM_MODEL
            }).then(function() {
              console.log('Daily brief generated');
            }).catch(function(e) {
              console.warn('Daily brief failed:', e.message);
            });
          "
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
      # [fix] replaced eval injection with safe direct command
      - name: Run allocation strategy & send email
        if: env.PRIVATE_LEDGER_AVAILABLE == '1'
        run: |
          STRATEGY="${{ inputs.strategy }}"
          if [ -z "$STRATEGY" ]; then STRATEGY="dynamic"; fi

          ARGS="--strategy $STRATEGY"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          echo "Running: node index.js $ARGS"
          node index.js $ARGS
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
          FIREBASE_UID: ${{ secrets.FIREBASE_UID }}
          RECOMMENDATION_LIVE_ENABLED: ${{ secrets.RECOMMENDATION_LIVE_ENABLED }}
          PORTFOLIO_FILE: ${{ env.PRIVATE_LEDGER_PATH }}
          PORTFOLIO_READ_ONLY: 1
      - name: Skip personalized allocation when private ledger is unavailable
        if: env.PRIVATE_LEDGER_AVAILABLE != '1'
        run: echo "Private ledger unavailable; skipping personalized allocation and email."
      - name: Build GitHub Pages
        run: node build-pages.js
        env:
          PRIVATE_LEDGER_PATH: ${{ env.PRIVATE_LEDGER_PATH }}
          PUBLIC_PORTFOLIO_SNAPSHOT: ${{ env.PRIVATE_LEDGER_AVAILABLE == '1' && '1' || '0' }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          RECOMMENDATION_LIVE_ENABLED: ${{ secrets.RECOMMENDATION_LIVE_ENABLED }}
      - name: Remove private ledger temp file
        if: always()
        run: rm -f "$PRIVATE_LEDGER_PATH"
      - name: Commit updated data and pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # [fix] only add tracked files, skip gitignored caches
          git add data/history.json data/nav-cache.json data/recommendation-plan.json
          # 复制外部信号到 docs/data/ (因为 data/external-signals-cache.json 被 gitignore)
          cp -f data/external-signals-cache.json docs/data/external-signals-cache.json 2>/dev/null || true
          git add -f docs/data/nav-cache.json docs/data/news.json docs/data/external-signals-cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update data & pages $(date +%Y/%m/%d)"
            # [fix] use --autostash to handle unstaged changes
            git pull --rebase --autostash origin main || { git rebase --abort; echo "Rebase conflict, skipping push"; exit 0; }
            git push origin main || echo "Push failed, skipping"
          fi
