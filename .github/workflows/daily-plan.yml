name: QDII
on:
  schedule:
    - cron: '0 0 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: dry-run
        required: false
        default: false
        type: boolean
      budget:
        description: budget
        required: false
        type: string
      strategy:
        description: strategy
        required: false
        default: dynamic
        type: choice
        options:
          - dynamic
          - scarce
          - low_fee
          - equal

jobs:
  generate-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Generate AI Daily Brief
        continue-on-error: true
        run: |
          node -e "
            var db = require('./lib/daily-brief');
            db.generateDailyBrief({
              apiKey: process.env.LLM_API_KEY,
              baseUrl: process.env.LLM_BASE_URL,
              model: process.env.LLM_MODEL
            }).then(function() {
              console.log('Daily brief generated');
            }).catch(function(e) {
              console.warn('Daily brief failed:', e.message);
            });
          "
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
      - name: Run allocation strategy & send email
        run: |
          CMD="node index.js"
          STRATEGY="${{ inputs.strategy }}"
          if [ -z "$STRATEGY" ]; then STRATEGY="dynamic"; fi
          CMD="$CMD --strategy $STRATEGY"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          echo "Running: $CMD"
          eval $CMD
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: Update NAV cache
        continue-on-error: true
        run: node -e "
          var https = require('https');
          var fs = require('fs');
          var nav = JSON.parse(fs.readFileSync('data/nav-cache.json','utf8'));
          var codes = Object.keys(nav);
          var done = 0, updated = 0, errors = 0;
          function fetchNav(code, cb) {
            var url = 'https://api.fund.eastmoney.com/f10/lsjz?callback=jQuery&fundCode=' + code + '&pageIndex=1&pageSize=3&startDate=' + new Date(Date.now()-7*86400000).toISOString().slice(0,10) + '&endDate=' + new Date().toISOString().slice(0,10) + '&_=1';
            var req = https.get(url, {headers: {'Referer': 'https://fundf10.eastmoney.com/'}, timeout: 5000}, function(res) {
              var data = '';
              res.on('data', function(c) { data += c; });
              res.on('end', function() {
                try {
                  var matches = data.match(/FSRQ\":\"(\d{4}-\d{2}-\d{2})\".*?DWJZ\":\"([\d.]+)\"/g);
                  if (matches) {
                    var existing = nav[code] || [];
                    var lastDate = existing.length > 0 ? existing[existing.length-1].date : '';
                    matches.forEach(function(m) {
                      var dm = m.match(/FSRQ\":\"(\d{4}-\d{2}-\d{2})\".*?DWJZ\":\"([\d.]+)\"/);
                      if (dm && dm[1] > lastDate) { existing.push({date: dm[1], nav: parseFloat(dm[2])}); updated++; }
                    });
                    existing.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});
                    nav[code] = existing;
                  }
                } catch(e) { errors++; }
                cb();
              });
            });
            req.on('timeout', function() { req.destroy(); errors++; cb(); });
            req.on('error', function() { errors++; cb(); });
          }
          var idx = 0;
          function next() {
            if (idx >= codes.length) {
              fs.writeFileSync('data/nav-cache.json', JSON.stringify(nav, null, 2));
              console.log('NAV updated: ' + updated + ' new, ' + errors + ' errors, ' + codes.length + ' funds');
              return;
            }
            fetchNav(codes[idx], function() { idx++; next(); });
          }
          next();
        "
      - name: Build GitHub Pages
        run: node build-pages.js
      - name: Commit updated data and pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/nav-cache.json data/fund-info-cache.json data/portfolio.json data/external-signals-cache.json data/daily-brief.json data/hypotheses.json
          git add -f docs/index.html docs/data/nav-cache.json docs/data/news.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update data & pages $(date +%Y/%m/%d)"
            git fetch origin main
            git push --force-with-lease || echo "Push failed (possibly due to concurrent changes), skipping"
          fi
