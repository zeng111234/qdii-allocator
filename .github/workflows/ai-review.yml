name: AI Code Review
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Run tests
        run: npm test
      - name: AI Code Review
        if: always()
        run: |
          set -euo pipefail

          # Get the diff
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            DIFF=$(git diff origin/main...HEAD --stat)
          else
            DIFF=$(git diff HEAD~1 --stat)
          fi

          # Create review prompt safely
          PROMPT_TEXT="请审查以下代码变更，检查：
          1. 边界case和错误处理
          2. 安全漏洞
          3. 性能问题
          4. 代码风格和可读性
          5. 潜在的bug

          变更内容：
          ${DIFF}

          请用中文输出审查报告，格式：
          - [严重] 问题描述
          - [警告] 问题描述  
          - [建议] 改进建议"

          node -e "const fs=require('fs'); const payload={model:process.env.LLM_MODEL||'',messages:[{role:'system',content:'你是一个代码审查专家。请审查代码变更并输出结构化的审查报告。'},{role:'user',content:process.env.PROMPT_TEXT}],temperature:0.1,max_tokens:2000}; fs.writeFileSync('/tmp/review-request.json', JSON.stringify(payload));"

          # Call LLM API safely
          RESPONSE=$(curl -s -X POST "${LLM_BASE_URL}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${LLM_API_KEY}" \
            -d @/tmp/review-request.json)

          REVIEW=$(echo "$RESPONSE" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);console.log((j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'审查失败');}catch(e){console.log('审查失败');}});")

          mkdir -p data
          {
            echo "# AI Code Review - $(date +%Y-%m-%d)"
            echo ""
            echo "## 变更摘要"
            echo '```'
            echo "$DIFF"
            echo '```'
            echo ""
            echo "## 审查报告"
            echo "$REVIEW"
          } > data/review-report.md

          echo "Review saved to data/review-report.md"
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-report
          path: data/review-report.md
          if-no-files-found: ignore
