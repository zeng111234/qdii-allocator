name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# [fix] explicit least-privilege permissions
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # [fix] add dependency caching
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      # [fix] npm install → npm ci for deterministic installs
      - run: npm ci
      # [fix] removed debug sed command that leaked source to logs
      - run: npm run lint
      - run: npm test
