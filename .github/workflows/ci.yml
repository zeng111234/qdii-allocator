name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: node -v && npx eslint --version
      - run: npx eslint lib/ index.js sync.js build-pages.js 2>&1; echo "EXIT: $?"
      - run: npm test
