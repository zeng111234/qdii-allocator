name: Build & Deploy Pages

on:
  # [fix] removed push trigger to avoid double-build with daily-plan.yml
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时自动构建一次（0,6,12,18点UTC）

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # [fix] pass secrets as env vars instead of writing to .env file
      - name: Build
        run: node build-pages.js
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
