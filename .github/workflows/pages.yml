name: Build & Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html.template'
      - 'data/funds.json'
      - 'data/history.json'
      - 'build-pages.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时自动构建一次（0,6,12,18点UTC）

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # [fix] nav-cache.json 从 git 移除了，需要先生成
      - name: Update NAV cache
        continue-on-error: true
        run: node scripts/update-nav-cache.js

      # [fix] pass secrets as env vars instead of writing to .env file
      - name: Build
        run: node build-pages.js
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
