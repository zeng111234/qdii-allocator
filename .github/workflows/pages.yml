name: Build & Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html.template'
      - 'docs/firebase-sync.js'
      - 'firebase.database.rules.json'
      - 'data/funds.json'
      - 'data/history.json'
      - 'data/nav-cache.json'
      - 'build-pages.js'
      - 'lib/allocation-policy.js'
      - 'lib/external-signal-display.js'
      - 'lib/personalized-decision.js'
      - 'lib/portfolio-ledger.js'
      - 'lib/recommendation-engine.js'
      - 'lib/walk-forward.js'
      - 'scripts/fetch-private-ledger.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时自动构建一次（0,6,12,18点UTC）

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Configure private ledger temp path
        run: echo "PRIVATE_LEDGER_PATH=$RUNNER_TEMP/portfolio-ledger.json" >> "$GITHUB_ENV"

      - name: Fetch and validate private PortfolioLedgerV2
        run: |
          set +e
          node scripts/fetch-private-ledger.js
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "PRIVATE_LEDGER_AVAILABLE=1" >> "$GITHUB_ENV"
          else
            echo "PRIVATE_LEDGER_AVAILABLE=0" >> "$GITHUB_ENV"
            echo "::warning::Private PortfolioLedgerV2 unavailable; publishing market-only page."
          fi
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
          FIREBASE_UID: ${{ secrets.FIREBASE_UID }}
          PRIVATE_LEDGER_PATH: ${{ runner.temp }}/portfolio-ledger.json

      # [fix] nav-cache.json 从 git 移除了，需要先生成
      - name: Update NAV cache
        continue-on-error: true
        run: node scripts/update-nav-cache.js

      # [fix] pass secrets as env vars instead of writing to .env file
      - name: Build
        run: node build-pages.js
        env:
          PRIVATE_LEDGER_PATH: ${{ env.PRIVATE_LEDGER_PATH }}
          PUBLIC_PORTFOLIO_SNAPSHOT: ${{ env.PRIVATE_LEDGER_AVAILABLE == '1' && '1' || '0' }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          RECOMMENDATION_LIVE_ENABLED: ${{ secrets.RECOMMENDATION_LIVE_ENABLED }}

      - name: Remove private ledger temp file
        if: always()
        run: rm -f "$PRIVATE_LEDGER_PATH"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
