    }

    /**
     * Score badge CSS class based on composite score.
     */
    function scoreBadgeClass(score) {
      if (score >= 70) return 'excellent';
      if (score >= 55) return 'good';
      if (score >= 40) return 'medium';
      return 'poor';
    }

    /**
     * Factor bar color based on normalized score (0-100).
     */
    function factorBarColor(score) {
      if (score >= 70) return 'var(--success)';
      if (score >= 50) return 'var(--primary)';
      if (score >= 30) return 'var(--warn)';
      return 'var(--danger)';
    }

    /**
     * Compute rankings for all active funds.
     * @param {Object} fullNav - full nav-cache.json data
     * @returns {Array} [{code, name, type, composite, factorScores, rawScores}, ...]
     */
    function computeRankings(fullNav) {
      var activeFunds = fundsData.funds.filter(function(f) {
        return f.status === 'active';
      });

      // Phase 1: Compute raw factor scores for each fund
      var fundResults = [];
      activeFunds.forEach(function(fund) {
        var navArr = null;
        var cached = fullNav ? fullNav[fund.code] : (navCacheData[fund.code] || null);
        if (cached && Array.isArray(cached) && cached.length >= 30) {
          var sorted = cached.slice().sort(function(a, b) {
            return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0);
          });
          navArr = sorted.map(function(x) { return x.nav; });
        } else if (cached && !Array.isArray(cached) && cached.nav) {
          // Single entry — not enough for factor computation
          navArr = null;
        }

        if (!navArr || navArr.length < 30) {
          fundResults.push({
            code: fund.code, name: fund.name, type: fund.type,
            rawScores: {}, composite: null, insufficient: true
          });
          return;
        }

        var rawScores = FactorEngine.computeAll(navArr, fund);
        fundResults.push({
          code: fund.code, name: fund.name, type: fund.type,
          rawScores: rawScores, composite: null, insufficient: false
        });
      });

      // Phase 2: Cross-sectional normalization per factor
      var factorIds = FactorEngine.list();
      var normalizedScores = {}; // {factorId: [{idx, score}, ...]}

      factorIds.forEach(function(fid) {
        var items = [];
        fundResults.forEach(function(r, idx) {
          if (!r.insufficient && r.rawScores[fid] !== null && r.rawScores[fid] !== undefined) {
            items.push({ idx: idx, score: r.rawScores[fid] });
          }
        });
        FactorEngine.normalize(items);
        normalizedScores[fid] = items;
      });

      // Phase 3: Assign normalized scores back
      factorIds.forEach(function(fid) {
        normalizedScores[fid].forEach(function(item) {
          if (!fundResults[item.idx].factorScores) fundResults[item.idx].factorScores = {};
          fundResults[item.idx].factorScores[fid] = item.normalized;
        });
      });

      // Phase 4: Compute composite scores
      var weights = FactorEngine.getDefaultWeights();
      fundResults.forEach(function(r) {
        if (r.insufficient || !r.factorScores) {
          r.composite = null;
        } else {
          r.composite = FactorEngine.weightedSum(r.factorScores, weights);
        }
      });

      // Phase 5: Sort by composite (descending), nulls at bottom
      fundResults.sort(function(a, b) {
        if (a.composite === null && b.composite === null) return 0;
        if (a.composite === null) return 1;
        if (b.composite === null) return -1;
        return b.composite - a.composite;
      });

      return fundResults;
    }

    /**
     * Build the ranking HTML for display.
     * @param {Array} results - sorted fund results
     * @returns {string} HTML string
     */
    function buildRankingHTML(results) {
      var html = '';
      var validResults = results.filter(function(r) { return r.composite !== null; });
      var avgScore = 0, maxScore = 0, minScore = 100;
      validResults.forEach(function(r) {
        avgScore += r.composite;
        if (r.composite > maxScore) maxScore = r.composite;
        if (r.composite < minScore) minScore = r.composite;
      });
      avgScore = validResults.length > 0 ? Math.round(avgScore / validResults.length * 100) / 100 : 0;

      // Summary cards
      html += '<div class="ranking-summary">';
      html += '<div class="ranking-summary-item"><div class="label">评分基金数</div>';
      html += '<div class="value">' + validResults.length + '/' + results.length + '</div></div>';
      html += '<div class="ranking-summary-item"><div class="label">平均综合评分</div>';
      html += '<div class="value">' + avgScore.toFixed(1) + '</div></div>';
      html += '<div class="ranking-summary-item"><div class="label">最高/最低</div>';
      html += '<div class="value">' + (validResults.length > 0 ? maxScore.toFixed(1) + '/' + minScore.toFixed(1) : '--') + '</div></div>';
      html += '</div>';

      // Sorting controls
      html += '<div class="ranking-controls">';
      html += '<span style="font-size:12px;color:var(--text2);font-weight:500">排序：</span>';
      var sortOptions = [
        { id: 'composite', label: '综合评分' },
        { id: 'momentum', label: '动量' },
        { id: 'volatility', label: '波动率' },
        { id: 'trend', label: '趋势' },
        { id: 'drawdown', label: '回撤' },
        { id: 'quality', label: '质量' },
        { id: 'qdii_special', label: 'QDII特色' }
      ];
      sortOptions.forEach(function(opt) {
        var isActive = _rankingState.sortBy === opt.id;
        html += '<span class="sort-btn' + (isActive ? ' active' : '') + '" ';
        html += 'onclick="sortByTheme(\'' + opt.id + '\')">' + opt.label + '</span>';
      });
      html += '</div>';

      // Sort results by selected theme if not composite
      var displayResults = results.slice(); // copy
      if (_rankingState.sortBy !== 'composite') {
        var theme = _rankingState.sortBy;
        displayResults.sort(function(a, b) {
          var sa = getThemeScore(a, theme);
          var sb = getThemeScore(b, theme);
          if (sa === null && sb === null) return 0;
          if (sa === null) return 1;
          if (sb === null) return -1;
          return sb - sa;
        });
      }

      // Fund ranking rows
      displayResults.forEach(function(r, rankIdx) {
        var rankNum = rankIdx + 1;
        var rankClass = rankNum <= 3 ? 'top' + rankNum : 'normal';
        var score = r.composite;
        var badgeClass = score !== null ? scoreBadgeClass(score) : 'medium';

        html += '<div class="ranking-row" onclick="toggleFactorBars(' + rankIdx + ')">';
        html += '<div class="ranking-header">';
        html += '<div class="ranking-left">';
        html += '<span class="ranking-rank ' + rankClass + '">' + rankNum + '</span>';
        html += '<span class="ranking-name" title="' + r.name + '">' + r.name + '</span>';
        html += '<span class="ranking-code">' + r.code + '</span>';
        if (r.type) html += '<span class="ranking-type">' + r.type + '</span>';
        html += '</div>';

        if (score !== null) {
          html += '<div class="score-badge ' + badgeClass + '">';
          html += '<span>' + score.toFixed(1) + '</span>';
          html += '<span class="score-label">综合</span>';
          html += '</div>';
        } else {
          html += '<div class="score-badge medium"><span>--</span><span class="score-label">暂无</span></div>';
        }
        html += '</div>';

        // Factor detail bars (hidden by default)
        html += '<div class="factor-bars" id="factor-bars-' + rankIdx + '">';
        if (r.factorScores) {
          var factorIds = FactorEngine.list();
          factorIds.forEach(function(fid) {
            var factor = FactorEngine.get(fid);
            var val = r.factorScores[fid];
            if (val === undefined || val === null) val = 50;
            var barWidth = Math.max(2, Math.min(100, val));
            var barColor = factorBarColor(val);
            // Show raw score too
            var rawVal = r.rawScores[fid];
            var rawStr = (rawVal !== null && rawVal !== undefined) ? rawVal.toFixed(2) : '--';
            html += '<div class="factor-bar-row">';
            html += '<span class="factor-bar-label">' + factor.name + '</span>';
            html += '<div class="factor-bar-track"><div class="factor-bar-fill" style="width:' + barWidth + '%;background:' + barColor + '"></div></div>';
            html += '<span class="factor-bar-value" style="color:' + barColor + '">' + val.toFixed(0) + '</span>';
            html += '</div>';
          });
        } else {
          html += '<div style="color:var(--text3);font-size:12px;text-align:center;padding:8px">数据不足，无法计算因子</div>';
        }
        html += '</div>';

        html += '</div>'; // .ranking-row
      });

      // Factor weight legend
      html += '<div class="factor-weight-note">';
      html += '<strong>评分模型</strong>（移植自 <a href="https://github.com/HKUDS/Vibe-Trading" target="_blank" style="color:var(--primary)">Vibe-Trading</a> 因子框架）<br>';
      html += '11个因子 · 6大类：动量(MA偏离/20日/60日/RSI) · 波动率(历史/下行) · 趋势(均线排列/区间位置) · 回撤(深度/恢复) · 质量(夏普/加权收益) · QDII特色(限购/费率)<br>';
      html += '数据来源：基金净值序列 · 交叉截面归一化 · 权重加权合成 · 满分100';
      html += '</div>';

      return html;
    }

    /**
     * Get theme average score for a fund result.
     */
    function getThemeScore(result, theme) {
      if (!result.factorScores) return null;
      var factors = FactorEngine.list(theme);
      if (factors.length === 0) return null;
      var sum = 0, cnt = 0;
      factors.forEach(function(fid) {
        var s = result.factorScores[fid];
        if (s !== null && s !== undefined) { sum += s; cnt++; }
      });
      return cnt > 0 ? Math.round(sum / cnt * 100) / 100 : null;
    }

    /**
     * Toggle factor detail bars for a ranking row.
     * Called by onclick on ranking row.
     */
    function toggleFactorBars(idx) {
      var el = document.getElementById('factor-bars-' + idx);
      if (el) {
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
      }
    }

    /**
     * Re-sort rankings by theme and re-render.
     */
    function sortByTheme(theme) {
      _rankingState.sortBy = theme;
      if (_rankingState.results) {
        var c = document.getElementById('ranking-content');
        c.innerHTML = buildRankingHTML(_rankingState.results);
      }
    }

    /**
     * Main render function for the ranking tab.
     * Uses two-phase loading: immediate with embedded data, then full history.
     */
    function renderRanking() {
      var c = document.getElementById('ranking-content');

      // Phase 1: Use embedded NAV data (quick, but limited to latest entries)
      var activeFunds = fundsData.funds.filter(function(f) { return f.status === 'active'; });

      // Check if we already have cached results
      if (_rankingState.results) {
        c.innerHTML = buildRankingHTML(_rankingState.results);
        return;
      }

      // Try with embedded navCacheData first
      var hasEmbeddedHistory = false;
      activeFunds.forEach(function(f) {
        var cached = navCacheData[f.code];
        if (cached && Array.isArray(cached) && cached.length >= 30) hasEmbeddedHistory = true;
      });

      if (hasEmbeddedHistory) {
        // Embedded data has history — compute immediately
        _rankingState.results = computeRankings(navCacheData);
        c.innerHTML = buildRankingHTML(_rankingState.results);
      } else {
        c.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text3)">⏳ 正在加载完整净值数据以计算因子评分...</div>';
      }

      // Phase 2: Load full NAV history for accurate computation
      loadFullNavCache(function(fullNav) {
        if (!fullNav) {
          if (!_rankingState.results) {
            c.innerHTML = '<div class="empty">⚠️ 无法加载净值数据，因子评分不可用</div>';
          }
          return;
        }
        _rankingState.fullNav = fullNav;
        _rankingState.results = computeRankings(fullNav);
        c.innerHTML = buildRankingHTML(_rankingState.results);
      });
    }

    var STORAGE_KEY = 'qdii-portfolio';
    function saveLocal() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(portfolioData)); } catch(e) {} }
    function loadLocal() {
      try {
        var saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          var p = JSON.parse(saved);
          if (p && p.holdings && p.holdings.length > 0) {
            // 合并 localStorage 和嵌入数据
            var merged = mergePortfolio({ holdings: PORTFOLIO_HOLDINGS || [] }, p);
            portfolioData = merged;
          }
        }
      } catch(e) {}
    }

    // 数据同步功能 - GitHub Gist
    var GIST_TOKEN_KEY = 'qdii-gist-token';
    var GIST_ID_KEY = 'qdii-gist-id';
    var DEFAULT_GIST_ID = '0c29f80b9caad13a1f80c0fb739c2964';

    function getGistToken() { try { return localStorage.getItem(GIST_TOKEN_KEY); } catch(e) { return null; } }
    function getGistId() { try { return localStorage.getItem(GIST_ID_KEY) || DEFAULT_GIST_ID; } catch(e) { return DEFAULT_GIST_ID; } }

    function setupSync() {
      var token = prompt('输入 GitHub Token（需要 gist 权限）：\n\n获取方式：GitHub Settings → Developer settings → Personal access tokens → 只勾选 gist');
      if (!token) return;
      localStorage.setItem(GIST_TOKEN_KEY, token);
      showToast('Token 已保存，正在创建云存储...');
      createGist(token);
    }

    function createGist(token) {
      var data = JSON.stringify(portfolioData, null, 2);
      fetch('https://api.github.com/gists', {
        method: 'POST',
        headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          description: 'QDII Fund Allocator Portfolio Data (auto-sync)',
          public: false,
          files: { 'portfolio.json': { content: data } }
        })
      }).then(function(r) { return r.json(); }).then(function(gist) {
        if (gist.id) {
          localStorage.setItem(GIST_ID_KEY, gist.id);
          showToast('✅ 云存储已创建！数据已同步');
          updateSyncStatus();
        } else {
          showToast('创建失败: ' + (gist.message || '未知错误'), true);
        }
      }).catch(function(e) {
        showToast('网络错误: ' + e.message, true);
      });
    }

    function syncUp() {
      var token = getGistToken();
      var gistId = getGistId();
      if (!token || !gistId) { setupSync(); return; }

      var data = JSON.stringify(portfolioData, null, 2);
      fetch('https://api.github.com/gists/' + gistId, {
        method: 'PATCH',
        headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ files: { 'portfolio.json': { content: data } } })
      }).then(function(r) { return r.json(); }).then(function(gist) {
        if (gist.id) {
          showToast('⬆️ 已上传到云端');
          updateSyncStatus();
        } else {
          if (gist.message === 'Bad credentials') {
            showToast('Token 过期，请重新设置', true);
            localStorage.removeItem(GIST_TOKEN_KEY);
          } else {
            showToast('上传失败: ' + (gist.message || '未知错误'), true);
          }
        }
      });
    }

    function syncDown() {
      var gistId = getGistId();
      if (!gistId) { showToast('请先设置云同步', true); return; }

      // Gist 读取不需要 token（如果是自己创建的 gist，用 token 更好）
      var token = getGistToken();
      var headers = {};
      if (token) headers['Authorization'] = 'token ' + token;

      fetch('https://api.github.com/gists/' + gistId, { headers: headers })
        .then(function(r) { return r.json(); })
        .then(function(gist) {
          if (gist.files && gist.files['portfolio.json']) {
            var content = gist.files['portfolio.json'].content;
            var data = JSON.parse(content);
            if (data && data.holdings) {
              // 合并：云端 + 本地
              var merged = mergePortfolio(portfolioData, data);
              portfolioData = merged;
              saveLocal();
              updateSummary();
              updateHoldings();
              showToast('⬇️ 已从云端同步，共 ' + merged.holdings.length + ' 只基金');
              updateSyncStatus();
            }
          } else {
            showToast('云端数据不存在', true);
          }
        }).catch(function(e) {
          showToast('下载失败: ' + e.message, true);
        });
    }

    function mergePortfolio(a, b) {
      var allCodes = {};
      [a, b].forEach(function(p) {
        (p.holdings || []).forEach(function(h) {
          if (!allCodes[h.code]) {
            allCodes[h.code] = JSON.parse(JSON.stringify(h));
          } else {
            // 合并 buys（去重：code+date+amount）
            var existingKeys = {};
            allCodes[h.code].buys.forEach(function(bu) {
              existingKeys[bu.date + '_' + bu.amount] = true;
            });
            h.buys.forEach(function(bu) {
              var key = bu.date + '_' + bu.amount;
              if (!existingKeys[key]) {
                allCodes[h.code].buys.push(bu);
                existingKeys[key] = true;
              }
            });
          }
        });
      });

      var merged = { holdings: [], startDate: null };
      Object.keys(allCodes).forEach(function(code) {
        var h = allCodes[code];
        if (h.buys && h.buys.length > 0) {
          h.buys.sort(function(x, y) { return x.date < y.date ? -1 : (x.date > y.date ? 1 : 0); });
          merged.holdings.push(h);
          h.buys.forEach(function(bu) {
            if (!merged.startDate || bu.date < merged.startDate) merged.startDate = bu.date;
          });
        }
      });
      return merged;

    function syncToServer() {
      // 合并 localStorage 和嵌入数据
      var embedded = { holdings: PORTFOLIO_HOLDINGS || [] };
      var local = portfolioData;
      var merged = { holdings: [], startDate: null };

      // 用 code 做 key 合并
      var allCodes = {};
      embedded.holdings.forEach(function(h) { allCodes[h.code] = JSON.parse(JSON.stringify(h)); });
      local.holdings.forEach(function(h) {
        if (!allCodes[h.code]) {
          allCodes[h.code] = JSON.parse(JSON.stringify(h));
        } else {
          // 合并 buys（去重：code+date+amount）
          var existingKeys = {};
          allCodes[h.code].buys.forEach(function(b) {
            existingKeys[b.date + '_' + b.amount] = true;
          });
          h.buys.forEach(function(b) {
            var key = b.date + '_' + b.amount;
            if (!existingKeys[key]) {
              allCodes[h.code].buys.push(b);
              existingKeys[key] = true;
            }
          });
        }
      });

      Object.keys(allCodes).forEach(function(code) {
        var h = allCodes[code];
        if (h.buys && h.buys.length > 0) {
          merged.holdings.push(h);
          h.buys.forEach(function(b) {
            if (!merged.startDate || b.date < merged.startDate) merged.startDate = b.date;
          });
        }
      });

      // 排序 buys
      merged.holdings.forEach(function(h) {
        h.buys.sort(function(a, b) { return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
      });

      portfolioData = merged;
      saveLocal();
      updateSummary();
      updateHoldings();
      showToast('数据已合并！共 ' + merged.holdings.length + ' 只基金');
    }

      items.slice(0, 8).forEach(function(item) {
        var score = item._score || 0;
        var icon = score > 0 ? '🟢' : (score < 0 ? '🔴' : '⚪');
        html2 += '<div style="padding:6px 0;border-bottom:1px solid var(--border);display:flex;gap:6px;align-items:flex-start">';
        html2 += '<span style="flex-shrink:0">' + icon + '</span>';
        html2 += '<span style="color:var(--text2)">' + item.title + '</span>';
        html2 += '</div>';
      });
      html2 += '</div>';

      // 主题情绪
      var themes = sentiment.byTheme || {};
      var hasThemeData = Object.keys(themes).some(function(t) { return themes[t].pos > 0 || themes[t].neg > 0; });
      if (hasThemeData) {
        var themeNames = { nasdaq: '纳指/科技', sp500: '美股大盘', hongkong: '港股/亚太', oil: '能源/商品' };
        html2 += '<div style="margin-top:10px;font-size:11px;color:var(--text3)">主题情绪:</div>';
        html2 += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">';
        Object.keys(themes).forEach(function(t) {
          var th = themes[t];
          if (th.pos > 0 || th.neg > 0) {
            var color = th.pos > th.neg ? 'var(--danger)' : (th.neg > th.pos ? 'var(--success)' : 'var(--text3)');
            html2 += '<span style="padding:3px 8px;background:var(--bg);border-radius:12px;font-size:11px;color:' + color + '">' + (themeNames[t] || t) + ' ' + (th.pos > 0 ? '+' + th.pos : '') + (th.neg > 0 ? '-' + th.neg : '') + '</span>';
          }
        });
        html2 += '</div>';
      }

      if (newsData.fetchedAt) {
        html2 += '<div style="font-size:10px;color:var(--text3);margin-top:8px;text-align:right">抓取时间: ' + newsData.fetchedAt.replace('T', ' ').slice(0, 19) + '</div>';
      }

      el.innerHTML = html2;
    }

    function runBacktest() {
      loadFullNavCache(function(fullNav) {
        var el = document.getElementById('backtest-content');
        if (!fullNav) {
          el.innerHTML = '<div style="color:var(--text3);font-size:12px">无法加载净值历史数据</div>';
          return;
        }

        // Walk-forward backtest simulation
        // Use portfolio's fund codes, simulate equal-weight allocation
        var codes = portfolioData.holdings.map(function(h) { return h.code; });
        if (codes.length === 0) {
          el.innerHTML = '<div style="color:var(--text3);font-size:12px">暂无持仓，无法回测</div>';
          return;
        }

        // Get aligned date series
        var allDates = {};
        codes.forEach(function(code) {
          if (fullNav[code]) {
            fullNav[code].forEach(function(n) { allDates[n.date] = true; });
          }
        });
        var dates = Object.keys(allDates).sort();
        if (dates.length < 150) {
          el.innerHTML = '<div style="color:var(--text3);font-size:12px">净值数据不足150天，无法进行走步回测</div>';
          return;
        }

        // Build NAV matrix
        var navMatrix = {};
        codes.forEach(function(code) {
          navMatrix[code] = {};
          if (fullNav[code]) {
            fullNav[code].forEach(function(n) { navMatrix[code][n.date] = n.nav; });
          }
        });

        // Walk-forward: train 120 days, test 30 days, slide forward
        var trainDays = 120, testDays = 30;
        var windows = [];
        var startIdx = 0;
        while (startIdx + trainDays + testDays <= dates.length) {
          var trainDates = dates.slice(startIdx, startIdx + trainDays);
          var testDates = dates.slice(startIdx + trainDays, startIdx + trainDays + testDays);

          // Calculate train period returns for each fund
          var trainReturns = {};
          codes.forEach(function(code) {
            var startNav = navMatrix[code][trainDates[0]];
            var endNav = navMatrix[code][trainDates[trainDates.length - 1]];
            if (startNav && endNav) {
              trainReturns[code] = (endNav - startNav) / startNav;
            }
          });

          // Equal-weight test period return
          var testReturn = 0, validCount = 0;
          codes.forEach(function(code) {
            var startNav = navMatrix[code][testDates[0]];
            var endNav = navMatrix[code][testDates[testDates.length - 1]];
            if (startNav && endNav) {
              testReturn += (endNav - startNav) / startNav;
              validCount++;
            }
          });
          if (validCount > 0) testReturn = testReturn / validCount * 100;

          windows.push({
            trainStart: trainDates[0],
            trainEnd: trainDates[trainDates.length - 1],
            testStart: testDates[0],
            testEnd: testDates[testDates.length - 1],
            testReturn: Math.round(testReturn * 100) / 100
          });

          startIdx += testDays;
        }

        if (windows.length === 0) {
          el.innerHTML = '<div style="color:var(--text3);font-size:12px">数据不足，无法生成回测窗口</div>';
          return;
        }

        // Calculate stats
        var wins = windows.filter(function(w) { return w.testReturn > 0; });
        var winRate = Math.round(wins.length / windows.length * 100);
        var totalReturn = windows.reduce(function(s, w) { return s + w.testReturn; }, 0);
        var best = Math.max.apply(null, windows.map(function(w) { return w.testReturn; }));
        var worst = Math.min.apply(null, windows.map(function(w) { return w.testReturn; }));
        var avgReturn = Math.round(totalReturn / windows.length * 100) / 100;

        var html2 = '<div class="insight-grid">';
        html2 += '<div class="insight-stat ' + (winRate >= 50 ? 'green' : 'red') + '"><div class="label">胜率</div><div class="value">' + winRate + '%</div></div>';
        html2 += '<div class="insight-stat ' + (totalReturn >= 0 ? 'blue' : 'red') + '"><div class="label">累计收益</div><div class="value">' + (totalReturn >= 0 ? '+' : '') + Math.round(totalReturn * 100) / 100 + '%</div></div>';
        html2 += '<div class="insight-stat green"><div class="label">最佳窗口</div><div class="value">+' + Math.round(best * 100) / 100 + '%</div></div>';
        html2 += '<div class="insight-stat red"><div class="label">最差窗口</div><div class="value">' + Math.round(worst * 100) / 100 + '%</div></div>';
        html2 += '</div>';
        html2 += '<div style="font-size:11px;color:var(--text3);margin-top:4px">' + windows.length + '个窗口 · 平均收益 ' + avgReturn + '%</div>';

        // Overfitting detection: compare train vs test
        var avgTrainReturn = 0;
        windows.forEach(function(w) {
          var trainRet = 0, tc = 0;
          codes.forEach(function(code) {
            var s = navMatrix[code][w.trainStart];
            var e = navMatrix[code][w.trainEnd];
            if (s && e) { trainRet += (e - s) / s; tc++; }
          });
          if (tc > 0) avgTrainReturn += trainRet / tc * 100;
        });
        avgTrainReturn = avgTrainReturn / windows.length;
        var overfitGap = Math.round((avgTrainReturn - avgReturn) * 100) / 100;
        var overfitRisk = overfitGap > 10 ? '🔴 高过拟合风险' : (overfitGap > 5 ? '🟡 中度过拟合风险' : '🟢 低过拟合风险');
        html2 += '<div style="padding:8px;background:' + (overfitGap > 10 ? '#fef2f2' : '#f0fdf4') + ';border-radius:6px;font-size:12px;margin-top:8px">';
        html2 += '过拟合检测: 训练均值 ' + Math.round(avgTrainReturn * 100) / 100 + '% vs 测试均值 ' + avgReturn + '% · 差距 ' + overfitGap + '% · ' + overfitRisk;
        html2 += '</div>';

        el.innerHTML = html2;

        // Performance Attribution
        runAttribution(navMatrix, codes, dates);
      });
    }

    function runAttribution(navMatrix, codes, dates) {
      var el = document.getElementById('attribution-content');
      if (!el) return;

      // Calculate each fund's contribution to portfolio return
      var recent30 = dates.slice(-30);
      var attributions = [];
      codes.forEach(function(code) {
        var fund = fundsData.funds.find(function(f) { return f.code === code; });
        var holding = portfolioData.holdings.find(function(h) { return h.code === code; });
        var inv = holding ? holding.buys.reduce(function(s, b) { return s + b.amount; }, 0) : 0;

        var startNav = navMatrix[code][recent30[0]];
        var endNav = navMatrix[code][recent30[recent30.length - 1]];
        var fundReturn = (startNav && endNav) ? Math.round((endNav - startNav) / startNav * 10000) / 100 : 0;

        attributions.push({
          code: code,
          name: fund ? fund.name : code,
          type: fund ? fund.type : '其他',
          invested: inv,
          return30d: fundReturn,
          contribution: inv * fundReturn / 100
        });
      });

      attributions.sort(function(a, b) { return b.contribution - a.contribution; });

      var html2 = '<div style="font-size:12px">';
      html2 += '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:2px solid var(--border);font-weight:600;font-size:11px">';
      html2 += '<span style="flex:2">基金</span><span style="width:60px;text-align:right">30日收益</span><span style="width:70px;text-align:right">贡献(元)</span></div>';

      var totalContribution = attributions.reduce(function(s, a) { return s + a.contribution; }, 0);
      attributions.slice(0, 10).forEach(function(a) {
        var cls = a.return30d >= 0 ? 'var(--danger)' : 'var(--success)';
        html2 += '<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);align-items:center">';
        html2 += '<span style="flex:2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + a.name + '">' + a.name + '</span>';
        html2 += '<span style="width:60px;text-align:right;color:' + cls + ';font-weight:600">' + (a.return30d >= 0 ? '+' : '') + a.return30d + '%</span>';
        html2 += '<span style="width:70px;text-align:right;color:' + (a.contribution >= 0 ? 'var(--danger)' : 'var(--success)') + '">' + (a.contribution >= 0 ? '+' : '') + Math.round(a.contribution * 100) / 100 + '</span>';
        html2 += '</div>';
      });
      html2 += '<div style="display:flex;justify-content:space-between;padding:6px 0;font-weight:600">';
      html2 += '<span>合计贡献</span>';
      html2 += '<span style="color:' + (totalContribution >= 0 ? 'var(--danger)' : 'var(--success)') + '">' + (totalContribution >= 0 ? '+' : '') + Math.round(totalContribution * 100) / 100 + '元</span>';
      html2 += '</div>';
      html2 += '</div>';

      el.innerHTML = html2;
    }

    if (dailyBriefData && dailyBriefData.content) {
      document.getElementById('brief-card').style.display = 'block';
      document.getElementById('daily-brief').textContent = dailyBriefData.content;
    }
  </script>
