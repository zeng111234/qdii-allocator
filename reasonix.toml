ry:\n    import pytesseract\n    from PIL import Image\n    \n    files = [\n        '.reasonix/attachments/clipboard-20260610-201003.552948-000001.png',\n        '.reasonix/attachments/clipboard-20260610-201020.383280-000002.png',\n        '.reasonix/attachments/clipboard-20260610-201034.831718-000003.png'\n    ]\n    \n    for f in files:\n        img = Image.open(f)\n        text = pytesseract.image_to_string(img, lang='chi_sim+eng')\n        print(f'=== {f} ===')\n        print(text[:500])  # 只打印前500字符\n        print()\nexcept ImportError:\n    print('pytesseract not available')\nexcept Exception as e:\n    print(f'Error: {e}')\n\" 2>&1 || echo \"OCR failed\")", "Bash(python -c \"\nimport base64\nimport json\n\nfiles = [\n    '.reasonix/attachments/clipboard-20260610-201003.552948-000001.png',\n    '.reasonix/attachments/clipboard-20260610-201020.383280-000002.png',\n    '.reasonix/attachments/clipboard-20260610-201034.831718-000003.png'\n]\n\nfor f in files:\n    with open(f, 'rb') as img_file:\n        img_data = base64.b64encode(img_file.read()).decode('utf-8')\n        print(f'File: {f}')\n        print(f'Size: {len(img_data)} bytes (base64)')\n        print()\n\")", "Bash(python -c \"\n# 尝试使用其他OCR方法\ntry:\n    # 检查是否有其他OCR库\n    import importlib\n    libs = ['easyocr', 'paddleocr', 'keras_ocr']\n    for lib in libs:\n        try:\n            importlib.import_module(lib)\n            print(f'{lib} is available')\n        except ImportError:\n            print(f'{lib} not available')\nexcept Exception as e:\n    print(f'Error: {e}')\n\")", "Bash(python -c \"\n# 尝试使用Windows的剪贴板查看图片内容\nimport subprocess\nimport os\n\n# 尝试使用PowerShell查看图片\ntry:\n    # 使用PowerShell读取图片内容\n    ps_cmd = '''\n    Add-Type -AssemblyName System.Windows.Forms\n    $clipboard = [System.Windows.Forms.Clipboard]::GetImage()\n    if ($clipboard) {\n        Write-Host 'Clipboard contains image'\n        Write-Host 'Size:' $clipboard.Width 'x' $clipboard.Height\n    } else {\n        Write-