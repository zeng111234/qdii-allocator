# Reasonix configuration.
# Resolution order: flag > ./reasonix.toml > ~/AppData/Roaming/reasonix/config.toml > built-in defaults.
# Secrets come from the environment via api_key_env; never put keys here.

config_version = 2
default_model = "deepseek-flash"
# language      = "zh"   # ui/model language; empty = auto-detect from $LANG / $REASONIX_LANG

[agent]
cold_resume_prune = true

[tools]
bash_timeout_seconds = 120

[codegraph]
enabled      = true   # built-in MCP server; off by default for first-run sessions
auto_install = true   # fetch the runtime when CodeGraph is enabled but missing
# path       = ""   # empty = cache, then PATH, then a bundle beside reasonix

[builtin_mcp]
time_enabled = true   # built-in Time MCP; off until manually enabled
context7_enabled = false   # built-in Context7 MCP; off until manually enabled

[lsp]
enabled = true   # language server tools; servers launch lazily when used
# [lsp.servers.go]
# command = "gopls"
# args = []
# extensions = [".go"]

[skills]
# paths = ["~/my-skills", "../shared/skills"]   # extra custom skill roots
# excluded_paths = ["~/.agents/skills"]   # hide convention roots without deleting folders
# max_depth = 3   # nested scan depth; set 1 for legacy root-only discovery
# disabled_skills = ["review"]   # hide noisy or unwanted skills

[permissions]
allow = ["bash=cd C:\\Users\\zeng\\Desktop\\trade && node index.js --dry-run --strategy dynamic 2>&1", "bash=pwd && ls", "bash=git remote -v", "bash=git add index.js README.md data/funds.json lib/ai-analyst.js lib/allocator.js lib/dynamic-strategy.js lib/external-signals.js lib/fund-data.js && git status", "bash=git commit -m \"fix: 修复X数据源连接、决策稳定性、基金数据时效性、外国基金覆盖\n\nPhase 1 - 外部信号与代理策略:\n- 添加 xMirrorWhitelist 配置支持自定义镜像\n- 代理不再默认开启,改为环境变量控制\n- 每个镜像返回详细状态/错误日志\n\nPhase 2 - 决策稳定性:\n- 去除 Math.random() 排序,改用确定性 localeCompare\n- 统一日期格式为零填充 YYYY/MM/DD\n- 修复 0% 收益被 || 跳过的 bug\n\nPhase 3 - 基金数据时效性:\n- 新增 GZTIME 过期估值检测\n- SYL_1N 为0时回退到 SYL_6N*2\n- 缓存TTL从24h缩短到4h\n- 新增高溢价/过期估值异常日志\n\nPhase 4 - 外国基金覆盖:\n- 市场快照扩展到13个国际指数/汇率/商品\n- AI提示词新增外国基金分析指南\n- 外部信号三层回退: 镜像->缓存->空信号\"", "bash=git push origin main", "bash=echo \"推送完成。查看 Actions: https://github.com/zeng111234/trade/actions\"\necho \"\"\necho \"自动触发时间: 每周一~五 UTC 15:00 (北京时间 23:00)\"\necho \"手动触发: 打开上面链接 -> QDII workflow -> Run workflow -> 选 dry_run=true 先测试\"", "bash=curl -s \"https://my-rsshub-z6ig.onrender.com/twitter/user/aleabitoreddit\" 2>&1 | head -30", "bash=curl -s \"https://my-rsshub-z6ig.onrender.com/twitter/user/aleabitoreddit\" 2>&1 | head -40", "bash=curl -s \"https://my-rsshub-z6ig.onrender.com/twitter/user/aleabitoreddit\" 2>&1 | head -5", "bash=git add index.js lib/external-signals.js data/funds.json && git commit -m \"feat: 支持自建RSSHub实例，已配置私有RSSHub获取X数据\n\n- 新增 rsshubUrl 配置项，自建实例优先于公共镜像\n- 测试通过：首次尝试即成功获取12条推文\n- 主题分析：nasdaq +3, globalTech +3, hongkong +1\" && git push origin main", "bash=git pull --rebase origin main && git push origin main", "bash=git stash && git pull --rebase origin main && git stash pop && git push origin main", "bash=git checkout --theirs data/fund-info-cache.json data/history.json && git add data/fund-info-cache.json data/history.json && git commit -m \"merge: accept remote cache updates\" && git push origin main", "edit_file=lib/external-signals.js", "edit_file=lib/ai-analyst.js", "bash=git add index.js lib/external-signals.js lib/ai-analyst.js && git commit -m \"feat: X推文提取具体股票代码和观点，AI融合大神持仓逻辑\n\n- 新增 extractTickerOpinions(): 提取 \\$TICKER 代码+情绪+上下文\n- 新增 extractOpinionSummaries(): 提取推文核心观点摘要\n- AI提示词新增【大神观点融合】: 当大神看好某股票时识别受益基金\n- AI报告新增'白毛股神最新观点'专区: 展示具体股票观点和推文摘要\" && git push origin main", "bash=git checkout --theirs data/fund-info-cache.json data/history.json && git add data/fund-info-cache.json data/history.json && git commit -m \"merge: accept remote cache\" && git push origin main", "write_file=watch.js", "edit_file=watch.js", "bash=git add watch.js && git commit -m \"feat: 添加 Serenity 推文实时监控脚本\n\n- 每 10 分钟轮询 RSSHub 检查新推文\n- 发现新推文立刻发邮件通知\n- 邮件包含推文内容、股票代码、原文链接\n- 已读推文持久化，避免重复通知\" && git push origin main", "edit_file=.github/workflows/daily-plan.yml", "bash=git add .github/workflows/daily-plan.yml && git commit -m \"fix: 定时任务改为每天早上8点(北京时间)运行\n\nUTC 00:00 = 北京时间 08:00，用户起床就能收到投资分析邮件\" && git pull --rebase origin main && git push origin main", "bash=git add lib/ai-analyst.js && git commit -m \"feat: AI报告新增口语化'实操建议'板块\n\n像朋友聊天一样告诉投资者现在是不是好时机、该怎么操作\n不再只是冷冰冰的量化报告\" && git pull --rebase origin main && git push origin main", "bash=sleep 5 && git push origin main", "edit_file=index.js", "bash=git add index.js lib/external-signals.js lib/ai-analyst.js && git commit -m \"feat: 从大神推文发现新投资方向，对比基金池找缺口\n\n- 新增 analyzeNewDirections(): 映射股票代码→投资主题→基金池覆盖检查\n- AI报告新增'新投资方向'板块: 列出大神看好但基金池未覆盖的方向\n- 改进主题匹配: 纳指100自动覆盖AI/半导体，港股覆盖台积电等\n- 当前缺口: CPO光子学、硅光子代工、化合物半导体\" && git pull --rebase origin main && git push origin main", "bash=head -20 README.md | cat -v", "bash=python3 -c \"\nwith open('README.md', 'rb') as f:\n    raw = f.read()\nprint('First 200 bytes hex:', raw[:200].hex())\nprint('File size:', len(raw))\n\"", "bash=node -e \"\nconst fs = require('fs');\nconst content = \\`# QDII基金投资操作系统\n\n每天早上自动帮你算好：今天该买哪几只QDII基金、各买多少，并追踪持仓盈亏、评估组合风险。\n\n## 核心功能\n\n| 功能 | 说明 |\n|------|------|\n| **智能排名** | 4种策略：平均主义 / 低费率优先 / 稀缺额度优先 / 智能动态（综合净值走势+外部信号+AI判断） |\n| **持仓追踪** | 记录每笔买入，自动计算盈亏、持仓成本、当前市值 |\n| **组合风控** | 基金相关性分析、组合夏普比率、最大回撤、健康度评分（0-100） |\n| **限购监控** | 自动检测限购额度变化，发现暂停/恢复申购时立刻提醒 |\n| **替代方案** | 某只基金限购/停购时，自动推荐同类型替代基金（含场内ETF） |\n| **外部信号** | 抓取 X/Twitter 大V观点，分析投资主题情绪，影响评分 |\n| **AI分析** | 调用 LLM 生成投资决策报告，结合市场新闻和持仓数据给出个性化建议 |\n| **回测优化** | 历史回测验证策略效果，网格搜索自动优化评分权重 |\n| **邮件推送** | 每天自动发投资计划到邮箱，含排名、持仓、风控、AI报告 |\n| **GitHub Actions** | 不需要自己的服务器，每天定时自动运行 |\n\n## 快速开始\n\n### 1. 克隆安装\n\n\\\\\\`\\\\\\`\\\\\\`bash\ngit clone https://github.com/你的用户名/qdii-allocator.git\ncd qdii-allocator\nnpm install\n\\\\\\`\\\\\\`\\\\\\`\n\n### 2. 配置基金池\n\n编辑 \\\\\\`data/funds.json\\\\\\`，每只基金的关键字段：\n\n\\\\\\`\\\\\\`\\\\\\`json\n{\n  \\\"code\\\": \\\"270042\\\",\n  \\\"name\\\": \\\"广发纳斯达克100A(QDII)\\\",\n  \\\"type\\\": \\\"纳指100\\\",\n  \\\"feeRate\\\": 0.8,\n  \\\"dailyLimit\\\": 100,\n  \\\"status\\\": \\\"active\\\"\n}\n\\\\\\`\\\\\\`\\\\\\`\n\n- \\\\\\`status\\\\\\`: \\\\\\`\\\"active\\\"\\\\\\` 正常申购 / \\\\\\`\\\"suspended\\\"\\\\\\` 暂停申购\n- \\\\\\`dailyLimit\\\\\\`: 每天限购金额（元），设 \\\\\\`0\\\\\\` 表示不可买\n- \\\\\\`feeRate\\\\\\`: 管理费率（%），低费率优先策略用\n\n### 3. 配置邮件和AI\n\n\\\\\\`\\\\\\`\\\\\\`bash\ncp .env.example .env\n\\\\\\`\\\\\\`\\\\\\`\n\n编辑 \\\\\\`.env\\\\\\` 填入：\n\n| 配置项 | 说明 | 示例 |\n|--------|------|------|\n| \\\\\\`SMTP_HOST\\\\\\` | SMTP服务器 | \\\\\\`smtp.qq.com\\\\\\` |\n| \\\\\\`SMTP_PORT\\\\\\` | 端口 | \\\\\\`465\\\\\\` |\n| \\\\\\`SMTP_USER\\\\\\` | 发件邮箱 | \\\\\\`xxx@qq.com\\\\\\` |\n| \\\\\\`SMTP_PASS\\\\\\` | SMTP授权码 | \\\\\\`abcdef1234\\\\\\` |\n| \\\\\\`MAIL_TO\\\\\\` | 收件邮箱 | \\\\\\`xxx@163.com\\\\\\` |\n| \\\\\\`LLM_API_KEY\\\\\\` | AI API密钥（可选） | \\\\\\`sk-xxx\\\\\\` |\n| \\\\\\`LLM_BASE_URL\\\\\\` | AI接口地址（可选） | \\\\\\`https://api.example.com/v1/chat/completions\\\\\\` |\n| \\\\\\`LLM_MODEL\\\\\\` | 模型名（可选） | \\\\\\`mimo-v2.5-pro\\\\\\` |\n\n> QQ邮箱授权码：设置 > 账户 > POP3/SMTP服务 > 开启 > 生成授权码\n\n### 4. 部署到 GitHub Actions\n\n1. 在 GitHub 上创建仓库，推送代码\n2. 进入仓库 Settings > Secrets and variables > Actions\n3. 添加上面表格中的 Secrets\n4. 推送代码后，每天自动运行\n5. 可在 Actions 页面手动触发测试\n\n## 命令速查\n\n### 试运行（不发邮件）\n\n\\\\\\`\\\\\\`\\\\\\`bash\n# 默认策略试运行\nnode index.js --dry-run\n\n# 指定预算和策略\nnode index.js --dry-run --budget 30 --strategy dynamic\n\\\\\\`\\\\\\`\\\\\\`\n\n### 持仓管理\n\n\\\\\\`\\\\\\`\\\\\\`bash\n# 查看当前持仓\nnode index.js --portfolio\n\n# 记录单笔买入（代码 + 金额，净值可选）\nnode index.js --buy 270042 10\n\n# 批量录入（逗号分隔多笔）\nnode index.js --quick-add \\\"270042 10, 040046 20, 161130 15\\\"\n\n# 从文件批量导入\nnode index.js --import-file data/buys.txt\n\\\\\\`\\\\\\`\\\\\\`\n\n\\\\\\`data/buys.txt\\\\\\` 支持三种格式：\n\n\\\\\\`\\\\\\`\\\\\\`\n# 格式1: 代码 金额 [净值]\n270042 10 8.5243\n\n# 格式2: 基金名称 金额\n广发纳斯达克100 10\n\n# 格式3: 买入 基金名称 XX元 确认净值XX\n买入 华安纳斯达克100 20元 确认净值8.1467\n\\\\\\`\\\\\\`\\\\\\`\n\n### 今日推荐\n\n\\\\\\`\\\\\\`\\\\\\`bash\n# 显示今日推荐基金和快捷买入指令\nnode index.js --today\n\\\\\\`\\\\\\`\\\\\\`\n\n### 回测和优化\n\n\\\\\\`\\\\\\`\\\\\\`bash\n# 策略回测（默认60天）\nnode index.js --backtest\n\n# 指定回测天数\nnode index.js --backtest --backtest-days 120\n\n# 权重优化（网格搜索最优参数）\nnode index.js --optimize-weights\n\\\\\\`\\\\\\`\\\\\\`\n\n## 分配策略说明\n\n| 策略 | 参数 | 逻辑 |\n|------|------|------|\n| 稀缺额度优先 | \\\\\\`scarce\\\\\\` | 先买限额最小的基金（稀缺货），再买限额大的 |\n| 低费率优先 | \\\\\\`low_fee\\\\\\` | 管理费低的基金优先买满 |\n| 平均主义 | \\\\\\`equal\\\\\\` | 预算平均分给所有可申购基金 |\n| 智能动态 | \\\\\\`dynamic\\\\\\` | 综合净值走势、限购信号、外部信号、AI判断做TopN排名 |\n\n### 智能动态策略详情\n\n\\\\\\`dynamic\\\\\\` 策略是最完整的分析模式：\n\n1. **净值走势分析**：计算每只基金的MA均线、波动率、回撤等技术指标\n2. **限购信号**：限购额度越低 = 基金越稀缺 = 品质信号，自动加分\n3. **外部信号**：抓取 X/Twitter 大V观点，分析看涨/看跌情绪\n4. **AI决策**：调用 LLM 综合所有数据生成投资报告\n5. **历史回填**：自动计算历史推荐的实际5日/10日收益\n\n## 外部信号配置\n\n在 \\\\\\`data/funds.json\\\\\\` 的 \\\\\\`config\\\\\\` 中配置：\n\n\\\\\\`\\\\\\`\\\\\\`json\n{\n  \\\"xSourceUrl\\\": \\\"https://x.com/aleabitoreddit\\\",\n  \\\"enableExternalSignals\\\": true,\n  \\\"externalSignalMaxScore\\\": 3,\n  \\\"rsshubUrl\\\": \\\"https://your-rsshub-instance.com\\\"\n}\n\\\\\\`\\\\\\`\\\\\\`\n\n| 配置项 | 说明 | 默认值 |\n|--------|------|--------|\n| \\\\\\`xSourceUrl\\\\\\` | 目标 X 账号地址 | \\\\\\`https://x.com/aleabitoreddit\\\\\\` |\n| \\\\\\`enableExternalSignals\\\\\\` | 是否启用外部信号 | \\\\\\`true\\\\\\` |\n| \\\\\\`externalSignalMaxScore\\\\\\` | 外部信号对总分的最大影响 | \\\\\\`3\\\\\\` |\n| \\\\\\`rsshubUrl\\\\\\` | 自建 RSSHub 地址（推荐） | 空（使用公共镜像） |\n| \\\\\\`xMirrorWhitelist\\\\\\` | 自定义镜像列表 | 空（使用内置列表） |\n\n### 代理环境变量\n\n| 变量 | 说明 |\n|------|------|\n| \\\\\\`HTTP_PROXY\\\\\\` / \\\\\\`HTTPS_PROXY\\\\\\` / \\\\\\`ALL_PROXY\\\\\\` | 标准代理地址 |\n| \\\\\\`EXTERNAL_PROXY_AUTO\\\\\\` | 设置后启用代理自动回退（默认关闭） |\n| \\\\\\`EXTERNAL_PROXY_DISABLED\\\\\\` | 设置后完全禁用代理逻辑 |\n\n## 持仓追踪\n\n系统会自动计算：\n\n- **总投入**：所有买入金额之和\n- **当前市值**：持有份额 × 最新净值\n- **盈亏**：当前市值 - 总投入\n- **持仓成本**：加权平均买入净值\n- **组合健康度**：0-100分，综合分散度、夏普比率、回撤控制\n\n持仓数据存储在 \\\\\\`data/portfolio.json\\\\\\`，支持多次买入同一基金。\n\n## 组合风控\n\n当有持仓数据时，系统自动计算：\n\n- **基金相关性矩阵**：皮尔逊相关系数，识别高度相关的基金\n- **组合夏普比率**：风险调整后收益\n- **组合最大回撤**：历史最大亏损幅度\n- **集中度分析**：持仓类型分布，过于集中时发出警告\n- **健康度评分**：0-100分综合评估\n\n## 限购监控\n\n每天运行时自动检测：\n\n- 限购额度变化（升降）\n- 暂停申购 / 恢复申购\n- 发现变化时自动更新 \\\\\\`data/funds.json\\\\\\`，并在邮件中提醒\n\n## 替代方案\n\n当基金不可买时，系统自动推荐替代基金：\n\n- 同类型其他基金公司的产品\n- 场内 ETF（无限购，但可能溢价）\n- 场内 LOF（可通过券商买入）\n\n替代方案覆盖：纳指100、标普500、港股、全球精选、亚太、石油、REITs 等主流类型。\n\n## 项目结构\n\n\\\\\\`\\\\\\`\\\\\\`\n├── index.js                    # 主入口，CLI命令处理\n├── watch.js                    # X/Twitter 推文实时监控（可选）\n├── lib/\n│   ├── allocator.js            # 基础分配算法（equal/low_fee/scarce）\n│   ├── dynamic-strategy.js     # 智能动态策略（综合评分）\n│   ├── ai-analyst.js           # AI分析模块（LLM调用）\n│   ├── mailer.js               # 邮件发送模块\n│   ├── portfolio.js            # 持仓追踪模块\n│   ├── risk.js                 # 组合风控模块\n│   ├── alternatives.js         # 替代方案模块\n│   ├── external-signals.js     # 外部信号抓取（X/Twitter）\n│   ├── fund-data.js            # 基金数据获取（净值、行情）\n│   └── backtest.js             # 回测和权重优化\n├── data/\n│   ├── funds.json              # 基金池配置（手动维护）\n│   ├── portfolio.json          # 持仓记录（自动维护）\n│   ├── history.json            # 历史推荐记录\n│   ├── nav-cache.json          # 净值缓存\n│   ├── fund-info-cache.json    # 基金信息缓存\n│   ├── buys.txt                # 买入记录文件（用于导入）\n│   └── seen-tweets.json        # 已读推文记录\n├── .github/workflows/\n│   └── daily-plan.yml          # GitHub Actions 定时任务\n├── .env.example                # 配置模板\n└── README.md\n\\\\\\`\\\\\\`\\\\\\`\n\n## 常见问题\n\n**Q: 限购额度怎么知道？**\nA: 系统会自动检测限购变化并更新 \\\\\\`funds.json\\\\\\`。也可以手动查看天天基金/支付宝的基金详情页。\n\n**Q: 能不能自动获取限购额度？**\nA: 可以！系统每天运行时会调用基金API获取最新限购状态，发现变化自动更新并邮件提醒。\n\n**Q: 微信/支付宝买的基金怎么录入？**\nA: 三种方式：\n1. 单笔：\\\\\\`node index.js --buy 270042 10\\\\\\`\n2. 批量：\\\\\\`node index.js --quick-add \\\"270042 10, 040046 20\\\"\\\\\\`\n3. 文件：编辑 \\\\\\`data/buys.txt\\\\\\`，然后 \\\\\\`node index.js --import-file\\\\\\`\n\n**Q: 邮件发不出去？**\nA: 检查SMTP授权码是否正确（不是QQ邮箱密码），确认端口465。\n\n**Q: AI分析没反应？**\nA: LLM配置是可选的，不配置就跳过。配好 \\\\\\`.env\\\\\\` 中的 \\\\\\`LLM_API_KEY\\\\\\` 后会自动调用。\n\n**Q: 外部信号获取失败？**\nA: 公共RSSHub镜像可能不稳定。建议自建RSSHub实例，在 \\\\\\`funds.json\\\\\\` 中配置 \\\\\\`rsshubUrl\\\\\\`。\n\n**Q: 组合健康度多少分算好？**\nA: 80分以上为健康，60-80为一般，60以下需要关注。主要看分散度和回撤控制。\n\n**Q: 能投C类基金吗？**\nA: 默认预置的是A类份额。你可以在 \\\\\\`funds.json\\\\\\` 中添加任何基金，修改 \\\\\\`shareClass\\\\\\` 字段即可。\n\n**Q: 回测结果可信吗？**\nA: 回测基于历史数据，不代表未来表现。但可以帮助验证策略逻辑是否合理，以及优化权重参数。\n\\`;\nfs.writeFileSync('README.md', content, 'utf8');\nconsole.log('Done, wrote', content.length, 'bytes');\n\"", "write_file=data/gen-readme.js", "bash=node data/gen-readme.js", "bash=file README.md && head -10 README.md", "bash=rm data/gen-readme.js && echo \"Cleaned up\" && cat README.md | head -30", "bash=wc -l README.md && tail -10 README.md", "edit_file=README.md", "bash=git status 2>&1", "bash=git add README.md data/funds.json index.js lib/portfolio.js && git commit -m \"feat: 支持QDII基金T+2结算延迟，更新README\n\n- 为funds.json中每只基金添加settleDays字段（默认2表示T+2）\n- 新增calcSettleDate和findNavOnOrAfter函数\n- recordBuy自动计算结算日期并用结算日净值查找\n- 修复--buy命令日期解析bug（parseFloat误解析日期为数字）\n- 更新持仓报告显示买入明细和结算日\n- 更新README文档说明结算日处理和FAQ\" 2>&1", "bash=node index.js --buy 270042 10 2025-05-28 2>&1 | head -5", "bash=node -e \"\nvar fs = requir